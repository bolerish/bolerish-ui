name: Publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  publish:
    # Automatic tag publishing remains paused; manual releases require a green Verify run.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: publish npm package
    runs-on: ubuntu-latest

    steps:
      - name: Require successful Verify on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified_sha="$(gh api "repos/${{ github.repository }}/actions/workflows/verify.yml/runs" --method GET -f head_sha="$GITHUB_SHA" -f status=completed --jq '[.workflow_runs[] | select(.conclusion == "success")][0].head_sha // ""')"
          if [ "$verified_sha" != "$GITHUB_SHA" ]; then
            echo "Verify must pass on $GITHUB_SHA before a manual release."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the UI and tokens release group
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"

          for package_file in packages/tokens/package.json packages/ui/package.json; do
            package_name="$(node -p "require('./' + process.argv[1]).name" "$package_file")"
            package_version="$(node -p "require('./' + process.argv[1]).version" "$package_file")"

            if [ "$tag_version" != "$package_version" ]; then
              echo "Tag v$tag_version does not match $package_name@$package_version."
              exit 1
            fi
          done

      - name: Verify and publish unpublished workspace packages
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
