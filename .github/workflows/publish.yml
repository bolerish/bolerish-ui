name: Publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  publish:
    # Automatic tag publishing remains paused; manual releases require a green Verify run.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: publish npm package
    runs-on: ubuntu-latest

    steps:
      - name: Require successful Verify on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified_sha="$(gh api "repos/${{ github.repository }}/actions/workflows/verify.yml/runs" --method GET -f head_sha="$GITHUB_SHA" -f status=completed --jq '[.workflow_runs[] | select(.conclusion == "success")][0].head_sha // ""')"
          if [ "$verified_sha" != "$GITHUB_SHA" ]; then
            echo "Verify must pass on $GITHUB_SHA before a manual release."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Check npm supports Trusted Publishing
        run: |
          node -e 'const [major, minor, patch] = require("node:child_process").execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number); if (major < 11 || major === 11 && (minor < 5 || minor === 5 && patch < 1)) throw new Error("npm 11.5.1 or newer is required")'
          npm --version

      - name: Verify and pack release artifacts
        run: pnpm check && pnpm test && pnpm build:ui && pnpm pack:check && pnpm build:docs

      - name: Publish UI and tokens with OIDC
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.artifacts/publish"
          for package in tokens ui; do
            package_name="$(node -p "require('./packages/' + process.argv[1] + '/package.json').name" "$package")"
            package_version="$(node -p "require('./packages/' + process.argv[1] + '/package.json').version" "$package")"
            if npm view "$package_name@$package_version" version --json > /dev/null 2>&1; then
              echo "$package_name@$package_version is already published."
              continue
            fi
            pnpm --filter "$package_name" pack --pack-destination "$GITHUB_WORKSPACE/.artifacts/publish"
            npm publish "$GITHUB_WORKSPACE/.artifacts/publish/bolerish-$package-$package_version.tgz" --access public --provenance
          done
