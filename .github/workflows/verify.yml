name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # Keep browser dependencies off the slow Ubuntu package mirror.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter @bolerish/ui exec playwright install chromium firefox webkit
      - run: pnpm --filter @bolerish/ui test:browser
      - name: Upload browser and axe reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-accessibility
          path: packages/ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm build:docs
      - run: pnpm --filter @bolerish/docs test:browser
      - name: Upload responsive layout reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-responsive-layout
          path: docs/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm --filter @bolerish/docs test:static
      - name: Verify static HTTP contracts
        run: |
          pnpm --filter @bolerish/docs exec wrangler dev --config wrangler.jsonc --port 3004 > /tmp/docs-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail http://localhost:3004/ > /dev/null; then break; fi
            sleep 1
          done
          DOCS_URL=http://localhost:3004 pnpm --filter @bolerish/docs test:runtime
      - run: pnpm --filter @bolerish/docs test:agent
      - run: pnpm --filter @bolerish/docs test:dev
